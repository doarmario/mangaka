name: mangaka

services:
  installer:
    build: ./integrations/updater
    entrypoint: [/bin/bash, /opt/mangaka-install.sh]
    init: true
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mangaka}
      GIT_TERMINAL_PROMPT: '0'
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ${MANGA_NOVEL_SOURCE_DIR:-./.local/manga-novel-api}
        target: /upstream
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
    working_dir: /workspace
