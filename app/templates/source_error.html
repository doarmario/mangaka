{% extends 'base.html' %}
{% set page_title = 'Source unavailable' %}
{% block content %}
<section class="page-heading"><span class="eyebrow">Let us try another story</span><h1>This source did not respond.</h1><p role="alert">{{ message }}</p></section>
<div class="detail-actions">{% for key, label in g.sources.items() %}<a class="button secondary" href="{{ url_for('user.searchTitles', query=request.args.get('query'), source=key) if request.args.get('query') else url_for('user.mangaList', source=key) }}">Search in {{ label }}</a>{% endfor %}</div>
{% endblock %}
