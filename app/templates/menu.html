{% from 'ui.html' import icon %}
<header class="site-header">
    <div class="nav-shell">
        <a class="brand" href="{{ url_for('user.home') }}" aria-label="Mangaka, início"><span class="brand-mark">{{ icon('book') }}</span>mangaka<span class="brand-dot">.</span></a>
        <nav class="desktop-nav" aria-label="Principal">
            <a href="{{ url_for('user.home') }}" {% if request.endpoint == 'user.home' %}aria-current="page"{% endif %}>Descobrir</a>
            <a href="{{ url_for('user.mangaList') }}" {% if request.endpoint in ['user.mangaList', 'user.searchTitles'] %}aria-current="page"{% endif %}>Catálogo</a>
        </nav>
        {% include 'search.html' %}
        <div class="nav-account">
            {% if current_user.is_authenticated %}<a class="account-link" href="{{ url_for('auth.logout') }}">Sair</a>
            {% else %}<a class="account-link" href="{{ url_for('auth.login') }}">Entrar {{ icon('arrow') }}</a>{% endif %}
        </div>
        <button class="icon-button mobile-toggle" id="drop-btn" aria-label="Abrir navegação" aria-expanded="false" aria-controls="mobile-nav">{{ icon('menu') }}</button>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Navegação móvel" hidden>
        <a href="{{ url_for('user.home') }}">Descobrir</a><a href="{{ url_for('user.mangaList') }}">Catálogo</a>
    </nav>
</header>
