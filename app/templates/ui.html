{% macro icon(name) -%}
<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>
{% elif name == 'arrow' %}<path d="M5 12h14m-6-6 6 6-6 6"/>
{% elif name == 'left' %}<path d="m14 6-6 6 6 6"/>
{% elif name == 'right' %}<path d="m10 6 6 6-6 6"/>
{% elif name == 'heart' %}<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
{% elif name == 'sort' %}<path d="M4 6h16M4 12h11M4 18h6m8-4v7m-3-3 3 3 3-3"/>
{% elif name == 'menu' %}<path d="M4 7h16M4 12h16M4 17h16"/>
{% elif name == 'book' %}<path d="M12 5v15M3 4h5a4 4 0 0 1 4 3 4 4 0 0 1 4-3h5v15h-5a4 4 0 0 0-4 2 4 4 0 0 0-4-2H3Z"/>
{% elif name == 'up' %}<path d="M12 19V5m-6 6 6-6 6 6"/>
{% endif %}</svg>
{%- endmacro %}

{% macro card(item, chapter=false) -%}
<a class="manga-card" href="{{ url_for('user.mangaCap', cap_id=item.chapter) if chapter and item.chapter else url_for('user.manga_sinopse', manga_id=item.id) }}">
    <div class="card-art">
        <img src="{{ url_for('static', filename='img/cover-placeholder.svg') }}" data-src="{{ url_for('user.coverproxy', uuid=item.id, size=256) }}" alt="Capa de {{ item.title }}" loading="lazy" width="256" height="360">
        <span class="card-open">{{ icon('arrow') }}</span>
        {% if chapter and item.chapter %}<span class="card-label">Continuar leitura</span>{% endif %}
    </div>
    <h3>{{ item.title }}</h3>
    <span class="card-caption">{{ 'Voltar à história' if chapter and item.chapter else item.source_name | default('Conhecer mangá') }}</span>
</a>
{%- endmacro %}
