name: Tests
on: [push, pull_request]

jobs:
  canonical-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: canonical-test-only
          MYSQL_DATABASE: canonical_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcanonical-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_canonical_mysql.py
        env:
          MANGAKA_TEST_MYSQL_URL: mysql+pymysql://root:canonical-test-only@127.0.0.1:3306/canonical_test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node --test tests/*.test.cjs

  qiscans:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/qiscans
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: integrations/qiscans/pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q

  demonicscans:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/demonicscans
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: integrations/demonicscans/pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q

  thunderscans:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/thunderscans
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: integrations/thunderscans/pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q

  mangafire:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/mangafire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: integrations/mangafire/pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q

  updater-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mangaka-updater-test integrations/updater
      - run: docker run --rm --entrypoint bash -v "$PWD:/fixture:ro" mangaka-updater-test /fixture/tests/updater-legacy.test.sh
  source-image-permissions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [qiscans, demonicscans, thunderscans, mangafire]
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/source_image_permissions.py "${{ matrix.source }}"
