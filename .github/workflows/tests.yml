name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
  qiscans:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/qiscans
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: integrations/qiscans/pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q
  demonicscans:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/demonicscans
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: integrations/demonicscans/pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q
  updater-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mangaka-updater-test integrations/updater
      - run: docker run --rm --entrypoint bash -v "$PWD:/fixture:ro" mangaka-updater-test /fixture/tests/updater-legacy.test.sh
