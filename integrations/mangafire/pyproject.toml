[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "mangaka-mangafire"
version = "0.1.0"
description = "MangaFire content adapter for Mangaka"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.3",
  "beautifulsoup4==4.13.5",
  "requests==2.33.0",
  "gunicorn==23.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
include = ["mangafire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
mangafire = ["signature_stages.json"]
