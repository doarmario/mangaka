name: mangaka

x-app: &app
  image: mangaka-local
  build: .
  environment:
    SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY no .env}
    DB_HOST: mysql
    DB_USER: ${DB_USER:-mangaka}
    DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no .env}
    DB_NAME: ${DB_NAME:-mangaka}
    MANGA_NOVEL_API_URL: http://manga-novel:3001
    REDIS_HOST_CACHE: redis://redis:6379/0
    REDIS_HOST_SESSION: redis://redis:6379/1
    UPDATES_INTERVAL_SECONDS: ${UPDATES_INTERVAL_SECONDS:-1800}

services:
  manga-novel:
    build:
      context: ./integrations/manga-novel
      additional_contexts:
        upstream: ${MANGA_NOVEL_SOURCE_DIR:-../manga-novel-api}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mangaka}
      MYSQL_USER: ${DB_USER:-mangaka}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD no .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, volatile-lru]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  init-db:
    <<: *app
    command: [python, -m, flask, --app, app, init-db]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'

  web:
    <<: *app
    ports:
      - '${MANGAKA_BIND_ADDRESS:-127.0.0.1}:${MANGAKA_PORT:-5000}:5000'
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/auth/login', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
    restart: unless-stopped

  updates-worker:
    <<: *app
    command: [python, -m, app.update_worker]
    depends_on:
      init-db:
        condition: service_completed_successfully
      manga-novel:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
